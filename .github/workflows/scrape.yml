name: Scrape LoiloNote

on:
  schedule:
    # 定期実行: JST 7:00, 17:00, 20:00
    - cron: '0 22,8,11 * * *'
  workflow_dispatch:

# 同時実行を防ぐ設定（実行中に新たなリクエストが来た場合は前の処理をキャンセル）
concurrency:
  group: "scraper"
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # リベースを行うためにすべての履歴を取得

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

      - name: Run scraper
        env:
          LOILO_SCHOOL_ID: ${{ secrets.LOILO_SCHOOL_ID }}
          LOILO_USER_ID: ${{ secrets.LOILO_USER_ID }}
          LOILO_PASSWORD: ${{ secrets.LOILO_PASSWORD }}
        run: python scraper.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data.json history/
          # 変更がない場合は正常終了
          git commit -m "Update homework data and archive [skip ci]" || exit 0
          # 競合回避のため最新の履歴をリベースして取り込む
          git pull --rebase origin main
          git push
