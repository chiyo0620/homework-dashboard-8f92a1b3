name: Scrape LoiloNote

on:
  # 定期自動実行（schedule / cron）を完全に削除し、手動起動のみ受付
  workflow_dispatch:

# GitHub Actionsからdata.jsonを上書き保存するための権限
permissions:
  contents: write

concurrency:
  group: "scraper"
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

      - name: Run scraper
        env:
          LOILO_SCHOOL_ID: ${{ secrets.LOILO_SCHOOL_ID }}
          LOILO_USER_ID: ${{ secrets.LOILO_USER_ID }}
          LOILO_PASSWORD: ${{ secrets.LOILO_PASSWORD }}
        run: python scraper.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data.json
          git commit -m "Update homework data [skip ci]" || exit 0
          git pull --rebase origin main
          git push
