<!-- index.html のヘッダー部分へ追加するボタンと更新UI -->
<div class="sync-panel" style="margin-top: 10px; display: flex; justify-content: center; gap: 10px; align-items: center;">
  <button id="syncBtn" onclick="triggerWorkflowSync()" style="
    background: #2563eb;
    color: white;
    border: none;
    padding: 0.4rem 0.9rem;
    border-radius: 6px;
    font-size: 0.85rem;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.2s;
  ">🔄 ロイロノートから最新データを取得</button>
  <span id="syncStatus" style="font-size: 0.8rem; color: #94a3b8;"></span>
</div>

<script>
// GitHub Actions の手動実行を呼び出す関数
async function triggerWorkflowSync() {
  const syncBtn = document.getElementById('syncBtn');
  const syncStatus = document.getElementById('syncStatus');

  // ※ セキュリティのためトークンは localStorage または初回プロンプト入力で保持
  let token = localStorage.getItem('gh_pat_token');
  if (!token) {
    token = prompt('初回のみ：GitHub Personal Access Token（repo権限）を入力してください:');
    if (token) {
      localStorage.setItem('gh_pat_token', token.trim());
    } else {
      return;
    }
  }

  const owner = "chiyo0620"; // ※ご利用のGitHubユーザー名に変更してください
  const repo = "homework-dashboard-8f92a1b3";       // ※宿題アンテナのリポジトリ名に変更してください
  const workflowId = "scrape.yml";

  syncBtn.disabled = true;
  syncBtn.style.opacity = "0.6";
  syncStatus.textContent = "スクレイパーを起動中...";

  try {
    const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/actions/workflows/${workflowId}/dispatches`, {
      method: "POST",
      headers: {
        "Accept": "application/vnd.github.v3+json",
        "Authorization": `Bearer ${token}`
      },
      body: JSON.stringify({ ref: "main" })
    });

    if (res.ok) {
      syncStatus.textContent = "取得処理を開始しました（約1〜2分で反映されます）...";
      // 90秒後に自動リロード
      setTimeout(() => {
        syncStatus.textContent = "データを再読み込みしています...";
        loadHomework();
        syncBtn.disabled = false;
        syncBtn.style.opacity = "1.0";
      }, 90000);
    } else {
      throw new Error(`起動失敗 (ステータス: ${res.status})`);
    }
  } catch (err) {
    console.error(err);
    syncStatus.textContent = "エラー: 起動に失敗しました。トークン権限を確認してください。";
    syncBtn.disabled = false;
    syncBtn.style.opacity = "1.0";
  }
}
</script>
