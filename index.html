<script>
// GitHub Actions の手動実行を呼び出す関数
async function triggerWorkflowSync() {
  const syncBtn = document.getElementById('syncBtn');
  const syncStatus = document.getElementById('syncStatus');

  // ※ セキュリティのためトークンは localStorage または初回プロンプト入力で保持
  let token = localStorage.getItem('gh_pat_token');
  if (!token) {
    token = prompt('初回のみ：GitHub Personal Access Token（repo権限）を入力してください:');
    if (token) {
      localStorage.setItem('gh_pat_token', token.trim());
    } else {
      return;
    }
  }

  // アカウント名とリポジトリ名を設定済み
  const owner = "chiyo0620"; 
  const repo = "homework-dashboard-8f92a1b3"; 
  const workflowId = "scrape.yml";

  syncBtn.disabled = true;
  syncBtn.style.opacity = "0.6";
  syncStatus.textContent = "スクレイパーを起動中...";

  try {
    const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/actions/workflows/${workflowId}/dispatches`, {
      method: "POST",
      headers: {
        "Accept": "application/vnd.github.v3+json",
        "Authorization": `Bearer ${token}`
      },
      body: JSON.stringify({ ref: "main" })
    });

    if (res.ok) {
      syncStatus.textContent = "取得処理を開始しました（約2分で反映されます）...";
      
      // GitHub側の処理完了を待つため、120秒(120000ミリ秒)後に自動リロード
      setTimeout(async () => {
        syncStatus.textContent = "データを再読み込みしています...";
        await loadHomework(); // 最新の data.json を読み込み
        
        // 読み込み完了後にテキストを更新し、ボタンを有効化
        syncStatus.textContent = "✅ 最新データに更新しました！";
        syncBtn.disabled = false;
        syncBtn.style.opacity = "1.0";
        
        // 3秒後に完了メッセージを消去
        setTimeout(() => {
          syncStatus.textContent = "";
        }, 3000);
      }, 120000);
    } else {
      throw new Error(`起動失敗 (ステータス: ${res.status})`);
    }
  } catch (err) {
    console.error(err);
    syncStatus.textContent = "エラー: 起動に失敗しました。トークン権限を確認してください。";
    syncBtn.disabled = false;
    syncBtn.style.opacity = "1.0";
  }
}
</script>
